[project]
name = "pcap-reader"
version = "0.1.0"
description = "CLI tool to inspect and analyze PCAP/PCAPNG network capture files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
pcap-reader = "pcap_reader.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcap_reader"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
